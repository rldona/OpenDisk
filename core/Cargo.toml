[package]
name = "opendisk-core"
description = "Scanner, rule engine and safe cleaner behind OpenDisk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
globset = "0.4"
rayon = "1"
dashmap = "6"
thiserror = "2"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
