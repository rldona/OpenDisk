<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Repository cover / GitHub social preview (1280x640). Rendered by scripts/screenshots.mjs into cover.png. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #fff; position: relative;
    background:
      radial-gradient(900px 600px at 105% 105%, rgba(15, 118, 110, .55), transparent 62%),
      radial-gradient(700px 500px at -10% -20%, rgba(37, 99, 235, .30), transparent 60%),
      linear-gradient(135deg, #0a0f1a 0%, #0f1d2e 60%, #0b1720 100%);
  }
  .brand { position: absolute; left: 76px; top: 86px; width: 540px; }
  .icon { width: 132px; height: 132px; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .45)); }
  h1 { font-size: 92px; line-height: 1; letter-spacing: -2.5px; margin-top: 34px; font-weight: 800; }
  .tag { font-size: 32px; line-height: 1.3; margin-top: 22px; color: #cfe0f5; font-weight: 500; }
  .chips { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 34px; white-space: nowrap; }
  .chip { font-size: 17px; padding: 6px 13px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.28); background: rgba(255,255,255,.07); color: #e6eefa; }
  .shot {
    position: absolute; left: 640px; top: 96px; width: 760px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0, 0, 0, .6), 0 0 0 1.5px rgba(255, 255, 255, .14);
    background: #18181b;
  }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #232327; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="brand">
    <svg class="icon" viewBox="64 64 896 896" role="img" aria-label="OpenDisk icon">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2563eb"/>
          <stop offset="1" stop-color="#0f766e"/>
        </linearGradient>
      </defs>
      <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
      <circle cx="512" cy="512" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="96"/>
      <path d="M512 212 A300 300 0 0 1 812 512" fill="none" stroke="#ffffff" stroke-width="96" stroke-linecap="round"/>
      <circle cx="512" cy="512" r="70" fill="#ffffff"/>
    </svg>
    <h1>OpenDisk</h1>
    <p class="tag">See what fills your disk.<br>Free space safely.</p>
    <div class="chips">
      <span class="chip">Open source</span><span class="chip">No telemetry</span><span class="chip">Dev &amp; AI caches</span><span class="chip">macOS</span>
    </div>
  </div>
  <div class="shot">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <img id="app" alt="OpenDisk">
  </div>
</body>
</html>
