name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p opendisk-core -p opendisk-cli --all-targets -- -D warnings
      - run: cargo test -p opendisk-core -p opendisk-cli

  frontend:
    name: Frontend (lockfile, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Lockfile must only use the public npm registry
        run: |
          if grep -qiE 'jfrog|artifactory' package-lock.json; then
            echo "package-lock.json references a private registry"; exit 1
          fi
          node scripts/check-lockfile.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  macos-app:
    name: macOS app bundle (unsigned)
    runs-on: macos-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo clippy -p opendisk-app --all-targets -- -D warnings
      - name: Build universal .app and .dmg (ad-hoc signed, not notarized)
        working-directory: app
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDisk-macos-universal
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
